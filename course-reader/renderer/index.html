<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>課程閱讀器</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; font: 14px system-ui, sans-serif; color: #1f2937; background: #f3f4f6; }
  #sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 240px; background: #111827; color: #e5e7eb; display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; margin: 0; padding: 14px 16px; border-bottom: 1px solid #374151; }
  #list { flex: 1; overflow-y: auto; padding: 8px; }
  .site { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .site:hover { background: #1f2937; }
  .site.active { background: #2563eb; color: #fff; }
  .site .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site button { visibility: hidden; background: none; border: 0; color: inherit; cursor: pointer; opacity: .7; }
  .site:hover button { visibility: visible; }
  #add { padding: 10px; border-top: 1px solid #374151; display: grid; gap: 6px; }
  #add input { padding: 6px 8px; border-radius: 4px; border: 1px solid #4b5563; background: #1f2937; color: #fff; }
  #add button { padding: 6px; border: 0; border-radius: 4px; background: #374151; color: #fff; cursor: pointer; }
  #toolbar { position: fixed; left: 240px; right: 0; top: 0; height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #fff; border-bottom: 1px solid #e5e7eb; }
  #toolbar button { padding: 5px 10px; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; cursor: pointer; }
  #toolbar button:disabled { opacity: .4; cursor: default; }
  #url { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #6b7280; padding: 0 8px; }
  #empty { position: fixed; left: 240px; right: 0; top: 44px; bottom: 0; display: grid; place-items: center; color: #6b7280; }
</style>
</head>
<body>
  <aside id="sidebar">
    <h1>📚 課程閱讀器</h1>
    <div id="list"></div>
    <form id="add">
      <input name="name" placeholder="網站名稱" required>
      <input name="url" type="url" placeholder="https://..." required>
      <button>＋ 新增網站</button>
    </form>
  </aside>
  <div id="toolbar">
    <button id="back" disabled>←</button>
    <button id="forward" disabled>→</button>
    <button id="reload">⟳</button>
    <span id="url"></span>
    <button id="logout" title="清除此網站的登入資料">登出此站</button>
  </div>
  <div id="empty">從左側選擇一個課程網站開始閱讀</div>
  <script src="renderer.js"></script>
</body>
</html>
