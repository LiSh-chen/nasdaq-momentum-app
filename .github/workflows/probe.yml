name: Probe course sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          t(){ echo; echo "=================== $1"; curl -sL -m 30 -A "Mozilla/5.0" -w "\n[HTTP %{http_code} %{content_type}]\n" "$1" | head -c ${2:-1500}; echo; }
          t "https://api.learn.mit.edu/api/v1/courses/?offered_by=ocw&q=physics&limit=1" 3500
          t "https://api.learn.mit.edu/api/v1/learning_resources/?offered_by=ocw&resource_type=course&limit=1" 300
          t "https://api.learn.mit.edu/api/v1/learning_resources/?offered_by=ocw&resource_type=video&limit=1" 1500
          t "https://api.coursera.org/api/courses.v1?q=search&query=python&limit=1&fields=name,slug,photoUrl,description,primaryLanguages" 1200
          t "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/" 1200
          t "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/video_galleries/" 800
          t "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/sitemap.xml" 800
          t "https://ocw.mit.edu/sitemap.xml" 500
          t "https://ocw.aca.ntu.edu.tw/ntu-ocw/" 1500
          t "https://ocw.aca.ntu.edu.tw/ntu-ocw/index.php/ocw/search?keyword=%E5%BE%AE%E7%A9%8D%E5%88%86" 1500
          t "https://oyc.yale.edu/" 1200
          t "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=PPLop4L2eGk&format=json" 500
