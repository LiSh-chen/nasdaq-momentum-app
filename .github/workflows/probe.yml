name: Live check course sources
on:
  push:
    paths: ['.github/workflows/probe.yml', 'course-reader-mobile/scripts/live-check.mjs', 'course-reader-mobile/src/api/**']
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: live check against real MIT Learn API / OCW
        working-directory: course-reader-mobile
        run: node --experimental-default-type=module scripts/live-check.mjs
