name: Probe candidate course sources
on:
  push:
    paths: ['.github/workflows/source-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe round 4 (robots.txt first; plain requests, honest user agent)
        run: |
          set +e
          UA="Mozilla/5.0 (compatible; course-reader-probe/1.0)"
          g(){ curl -sL -m 30 -A "$UA" "$1"; }
          sec(){ echo; echo "=================== $*"; }

          for site in https://www.coursera.org https://ocw.nycu.edu.tw https://oyc.yale.edu https://www.sharecourse.net; do
            sec "robots.txt $site"
            g "$site/robots.txt" | grep -iE '^(user-agent|disallow|allow|crawl-delay)' | head -25
          done

          sec "NYCU: markup around a search result"
          g "https://ocw.nycu.edu.tw/?s=%E5%BE%AE%E7%A9%8D%E5%88%86" > /tmp/n2.html
          I=$(grep -n -m1 'course_page=all-course/college-of-science/am/%e5%be%ae%e7%a9%8d%e5%88%86%e4%b8%80-calculus-i-%e6%87%89' /tmp/n2.html | cut -d: -f1); echo "line: $I"
          sed -n "$((I-6)),$((I+12))p" /tmp/n2.html | tr -s ' \t' | cut -c1-300
          echo "--- distinct course anchors with text:"
          grep -oE '<a[^>]*href="https://ocw.nycu.edu.tw/\?course_page=all-course/[^"]*"[^>]*>[^<]{2,80}' /tmp/n2.html | sed -E 's/<a[^>]*href="[^"]*"[^>]*>//' | sort -u | head -12

          sec "Coursera: shape of one search hit in SSR data"
          g "https://www.coursera.org/search?query=python" > /tmp/c.html
          K=$(grep -ob '"name":"Crash Course on Python"' /tmp/c.html | head -1 | cut -d: -f1); echo "offset: $K"
          [ -n "$K" ] && head -c $((K+900)) /tmp/c.html | tail -c 1500 | tr -s ' \n'
