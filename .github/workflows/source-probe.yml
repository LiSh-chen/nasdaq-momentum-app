name: Probe candidate course sources
on:
  push:
    paths: ['.github/workflows/source-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe round 6 (univ.deltamoocx.net)
        run: |
          set +e
          UA="CourseReader/0.1 (personal study app)"
          B=https://univ.deltamoocx.net
          sec(){ echo; echo "=================== $*"; }
          sec robots.txt
          curl -sL -m 30 -A "$UA" "$B/robots.txt" | head -40
          sec "home headers"
          curl -s -D - -o /tmp/home.html -m 30 -A "$UA" -H "Origin: https://someone.github.io" "$B/" | grep -iE '^(HTTP/|server|content-type|access-control|x-frame|content-security|cf-|set-cookie)' | cut -c1-200
          echo "bytes=$(wc -c < /tmp/home.html)"
          grep -oiE '<title>[^<]*' /tmp/home.html
          sec "script/api hints"
          grep -oE '(src|href)="[^"]+"' /tmp/home.html | head -40
          grep -oiE '(api|graphql|json)[^"'"'"' ]{0,80}' /tmp/home.html | sort -u | head -20
          sec "body text sample"
          python3 - <<'PY'
          import re
          h=open('/tmp/home.html',encoding='utf-8',errors='replace').read()
          h=re.sub(r'<(script|style)[\s\S]*?</\1>','',h)
          print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',h))[:1500])
          print()
          print(re.sub(r'\s+',' ',h)[:2500])
          PY
          sec "course-like links"
          grep -oE 'href="[^"]*(course|class|lesson)[^"]*"' /tmp/home.html | sort -u | head -20
