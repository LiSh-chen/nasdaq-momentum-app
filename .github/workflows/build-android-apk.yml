name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/campus-course-reader-wmmoor]
    paths:
      - 'course-reader-mobile/**'
      - '!course-reader-mobile/scripts/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-reader-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: course-reader-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      # prebuild 產生的 release 預設使用 debug keystore 簽章，可直接側載安裝
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: course-reader-mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: course-reader-apk
          path: course-reader-mobile/android/app/build/outputs/apk/release/*.apk
